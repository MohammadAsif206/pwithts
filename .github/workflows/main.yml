name: Playwright Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Run Playwright tests
        run: npx playwright test

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Deploy Allure Report to GitHub Pages
        if: success() || failure()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      - name: Show Allure Report Link
        if: always()
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "🚀 Allure Report: $REPORT_URL"
          echo "## 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Open Allure Report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
      - name: Add report link to workflow summary
        run: |
          echo "## Playwright Report" >> $GITHUB_STEP_SUMMARY
          echo "[Open Playwright Report](https://mohammadasif206.github.io/pwithts/)" >> $GITHUB_STEP_SUMMARY
      - name: Add Allure link
        run: |
          echo "## Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "[Open Allure Report](https://mohammadasif206.github.io/pwithts/allure-report/)" >> $GITHUB_STEP_SUMMARY